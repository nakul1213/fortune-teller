name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # Fortune Teller ${{ github.ref_name }}
            
            This is an automated release of the Fortune Teller program.
            
            ## Changes in this version
            - Please add your specific changes here manually after release
            
            ## Files
            - fortune.py: The main program file
